version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DB_PATH=${DB_PATH:-data/templates.db}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_HOURS=${ACCESS_TOKEN_EXPIRE_HOURS:-8}
      - CORS_ORIGINS=https://srv1553019.hstgr.cloud
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Inline security-headers middleware
      - "traefik.http.middlewares.demo1-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.demo1-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.demo1-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.demo1-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.demo1-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.demo1-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Inline rate-limit middleware for auth endpoints
      - "traefik.http.middlewares.demo1-ratelimit.rateLimit.average=10"
      - "traefik.http.middlewares.demo1-ratelimit.rateLimit.burst=5"
      # Main app router
      - "traefik.http.routers.demo1-app.rule=Host(`srv1553019.hstgr.cloud`)"
      - "traefik.http.routers.demo1-app.entrypoints=websecure"
      - "traefik.http.routers.demo1-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demo1-app.middlewares=demo1-headers"
      - "traefik.http.services.demo1-app.loadbalancer.server.port=8000"
      # Auth router with rate-limit (higher priority)
      - "traefik.http.routers.demo1-auth.rule=Host(`srv1553019.hstgr.cloud`) && PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.demo1-auth.entrypoints=websecure"
      - "traefik.http.routers.demo1-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.demo1-auth.middlewares=demo1-headers,demo1-ratelimit"
      - "traefik.http.routers.demo1-auth.priority=10"
      - "traefik.http.services.demo1-auth.loadbalancer.server.port=8000"

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - dev
